<script type="text/x-red" data-help-name="grohe location">
    <p>Configuration node that authenticates against the Grohe Ondus API and tracks one location (with its rooms and appliances).</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Location <span class="property-type">string</span></dt>
        <dd>Name of the Grohe location to connect to (as it appears in the Grohe Ondus app).</dd>
        <dt>Username <span class="property-type">string</span></dt>
        <dd>Email address of your Grohe Ondus account.</dd>
        <dt>Password <span class="property-type">string</span></dt>
        <dd>Password of your Grohe Ondus account. Stored encrypted by Node-RED.</dd>
    </dl>

    <h3>Details</h3>
    <p>On startup the node logs in to <code>idp2-apigw.cloud.grohe.com</code>, retrieves the dashboard, and caches the rooms and appliances of the configured location. The access token is automatically refreshed every 30 minutes.</p>
    <p>If the internet is unavailable at startup, or the connection is later lost (including a failed token refresh), the node keeps retrying the login with exponential backoff (5&nbsp;s up to 60&nbsp;s) and recovers automatically once connectivity returns. Connection attempts, successes and failures are written to the Node-RED log. While disconnected the dependent <code>grohe sense</code> nodes show <i>disconnected</i>.</p>
</script>

<script type="text/x-red" data-help-name="grohe sense">
    <p>Reads the current state of a Grohe Sense, Grohe Sense Plus, or Grohe Sense Guard appliance, and optionally sends commands to a Sense Guard.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Location <span class="property-type">grohe location</span></dt>
        <dd>The configuration node that holds the credentials and identifies the location.</dd>
        <dt>Room <span class="property-type">string</span></dt>
        <dd>Name of the room the appliance lives in, matched <b>exactly</b> as shown in the Grohe Ondus app (including spaces and capitalization).</dd>
        <dt>Name <span class="property-type">string</span></dt>
        <dd>Name of the appliance, matched <b>exactly</b> as shown in the Grohe Ondus app. If the room / name does not match, the node logs the available names. If valve commands time out while reading works, the name is likely resolving to a stale, no longer registered appliance &ndash; rename it in the app and re-select it here.</dd>
        <dt>Type <span class="property-type">number</span></dt>
        <dd>Device type: <code>101</code> = Sense, <code>102</code> = Sense Plus, <code>103</code> = Sense Guard.</dd>
        <dt>Description <span class="property-type">string</span></dt>
        <dd>Optional label shown in the editor.</dd>
    </dl>

    <h3>Inputs</h3>
    <p>Any incoming message triggers an update. The contents of <code>msg.payload</code> select optional behaviour:</p>
    <dl class="message-properties">
        <dt class="optional">payload.command <span class="property-type">object</span></dt>
        <dd>Only for Sense Guard (type 103). An object of command fields; only whitelisted, correctly-typed fields are accepted. You only need to set the field(s) you want to change &ndash; the node reads the current command, merges your changes, and sends the complete object as <code>{ appliance_id, type, command }</code> (the API validates the whole command object). Example: <code>{ command: { valve_open: true } }</code>.
            <ul>
                <li><code>valve_open</code> (bool) &ndash; open / close the main valve</li>
                <li><code>measure_now</code> (bool) &ndash; take a reading now</li>
                <li><code>pressure_measurement_running</code> (bool)</li>
                <li><code>buzzer_on</code> (bool), <code>buzzer_sound_profile</code> (int)</li>
                <li><code>get_current_measurement</code> (bool)</li>
                <li><code>cleaning_mode</code>, <code>co2_status_reset</code>, <code>filter_status_reset</code>, <code>temp_user_unlock_on</code> (bool, GROHE Blue)</li>
                <li><code>reason_for_change</code> (int, optional metadata)</li>
            </ul>
            A wrong value type is rejected and nothing is sent.</dd>
        <dt class="optional">payload.commandb64 <span class="property-type">string</span></dt>
        <dd>Optional base64 command blob, passed through only when present.</dd>
        <dt class="optional">payload.data.from <span class="property-type">Date | number</span></dt>
        <dd>Start of the historical range (ISO date or milliseconds).</dd>
        <dt class="optional">payload.data.to <span class="property-type">Date | number</span></dt>
        <dd>End of the historical range.</dd>
        <dt class="optional">payload.data.groupBy <span class="property-type">string</span></dt>
        <dd>Aggregation granularity: <code>hour</code>, <code>day</code>, <code>week</code>, <code>month</code>, or <code>year</code> (the API expects lower case; input is accepted in any case and lower-cased; <code>hour</code> is the finest). An invalid value is rejected and falls back to <code>day</code>.</dd>
        <dt class="optional">debug <span class="property-type">boolean</span></dt>
        <dd>If <code>true</code>, the node emits a debug message with the raw API responses.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>The result is placed on <code>msg.payload</code> and contains:</p>
    <dl class="message-properties">
        <dt>info <span class="property-type">object</span></dt>
        <dd>Static appliance information (serial, type, firmware version, configuration).</dd>
        <dt>status <span class="property-type">object</span></dt>
        <dd>Current status flattened as <code>{ type: value }</code> (battery, wifi quality, connection state, ...).</dd>
        <dt>details <span class="property-type">object</span></dt>
        <dd>Detailed configuration of the appliance.</dd>
        <dt class="optional">measurement <span class="property-type">object</span></dt>
        <dd>Most recent reading (<code>temperature</code>, <code>humidity</code>, <code>battery</code>, or for Sense Guard <code>flowrate</code> / <code>pressure</code> / <code>temperature_guard</code>, plus <code>timestamp</code>) taken from <code>details.data_latest</code>. Only present when the appliance reports it.</dd>
        <dt class="optional">withdrawal <span class="property-type">object</span></dt>
        <dd>Sense Guard only: the latest water withdrawal (<code>starttime</code>, <code>stoptime</code>, <code>waterconsumption</code>, <code>maxflowrate</code>) from <code>details.data_latest</code>.</dd>
        <dt class="optional">consumption <span class="property-type">object</span></dt>
        <dd>Sense Guard only: consumption summary (<code>daily_consumption</code>, <code>daily_cost</code>, <code>average_daily_consumption</code>, <code>average_monthly_consumption</code>) from <code>details.data_latest</code>.</dd>
        <dt>notifications <span class="property-type">array</span></dt>
        <dd>Active notifications. Each entry includes the original API payload plus a human-readable <code>category</code> and <code>message</code>.</dd>
        <dt class="optional">command <span class="property-type">object</span></dt>
        <dd>Only for Sense Guard: the current command state (e.g. <code>valve_open</code>).</dd>
        <dt class="optional">measurements <span class="property-type">array</span></dt>
        <dd>Per-period historical readings from the aggregated response (<code>timestamp</code>, <code>flowrate</code>, <code>pressure</code>, <code>temperature</code>, <code>temperature_guard</code>, <code>humidity</code>, <code>battery</code>, ...). Only when <code>payload.data</code> was specified; defaults to <code>[]</code>.</dd>
        <dt class="optional">withdrawals <span class="property-type">array</span></dt>
        <dd>Per-event historical water draws from the aggregated response, either <code>{ starttime, stoptime, waterconsumption, maxflowrate }</code> or the per-period cost shape <code>{ date, waterconsumption, water_cost, energy_cost, hotwater_share }</code>. Only when <code>payload.data</code> was specified; defaults to <code>[]</code>.</dd>
        <dt class="optional">data <span class="property-type">object</span></dt>
        <dd>Raw aggregated historical data, full inner content (only when <code>payload.data</code> was specified on the input). Kept for backward compatibility.</dd>
        <dt class="optional">statistics <span class="property-type">object</span></dt>
        <dd>Pre-computed min/max temperature, humidity, pressure, flow rate, and today/total water consumption derived from <code>data</code>.</dd>
    </dl>

    <h3>Status</h3>
    <p>The node icon reflects the runtime state: <em>connecting</em>, <em>connected</em>, <em>updating</em>, <em>ok</em>, <em>N notifications</em>, <em>disconnected</em>, <em>&lt;name&gt; not found</em>, or <em>failed</em>. When the configuration node loses its connection the node shows <em>disconnected</em> and returns to <em>connected</em> automatically once it reconnects.</p>

    <h3>Examples</h3>
    <p>See the flows in the <code>examples/</code> folder of this package for ready-to-import sample flows.</p>
</script>
